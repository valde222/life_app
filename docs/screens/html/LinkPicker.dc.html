<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7080}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2E323D; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #F1F2F6; border-radius: 24px 24px 0 0; padding: 64px 20px 0;">
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.03em;">Why the staging deploy failed</div>
<div style="margin-top: 16px; height: 220px; border-radius: 18px; background: #FFFFFF;"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(21, 23, 30, 0.36);"></div>

<div role="dialog" aria-label="Link to" style="position: absolute; left: 0; right: 0; top: 150px; bottom: 0; background: #F1F2F6; border-radius: 24px 24px 0 0; padding-top: 10px; display: flex; flex-direction: column;">
<div style="width: 36px; height: 4px; border-radius: 2px; background: #C3C7D3; align-self: center;"></div>
<div style="margin-top: 12px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between;">
<div>
<h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;">Link to…</h2>

</div>
<a href="CaptureNote.dc.html" style="height: 40px; padding: 0 16px; border-radius: 12px; background: #3A4152; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center;">Done</a>
</div>

<label style="margin: 14px 16px 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #FFFFFF; border-radius: 14px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input aria-label="Search notes and todos" placeholder="Search notes and todos" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #15171E;">
</label>

<div role="tablist" aria-label="Show" style="margin: 10px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; background: #E3E5EC; border-radius: 12px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.name}}</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="margin-top: 14px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{g.label}}</div>
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<button aria-pressed="{{it.on}}" onClick="{{it.toggle}}" style="min-height: 56px; padding: 8px 12px 8px 14px; border: 0; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; text-align: left; color: #15171E;">
<span style="{{it.kindStyle}}">{{it.kind}}</span>
<span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 16px; font-weight: 600;">{{it.t}}</span><span style="display: block; font-size: 12px; color: #4B5060;">{{it.meta}}</span></span>
<span style="{{it.checkStyle}}"><sc-if value="{{it.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></sc-if></span>
</button>
</sc-for>
</div>
</sc-for>
<a href="CaptureNote.dc.html" style="margin-top: 12px; width: 100%; height: 48px; border-radius: 14px; border: 1.5px dashed #BCC1CF; background: transparent; font-size: 15px; font-weight: 600; color: #3A4152; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;">+ New note and link it</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var picked = s.picked || { deploy: true, staging: true };
var f = s.filter || 'all';
var data = [
{ label: 'Suggested for Client A', items: [
{ id: 'deploy', kind: 'Note', t: 'Deploy checklist', meta: 'Client A, Oct 8' },
{ id: 'staging', kind: 'Todo', t: 'Set up Client A staging', meta: 'Client A, due Fri' },
{ id: 'onboard', kind: 'Note', t: 'Client A onboarding', meta: 'Client A, Oct 14' }
] },
{ label: 'Recent', items: [
{ id: 'login', kind: 'Note', t: 'How the login flow works', meta: 'Client A, Oct 19' },
{ id: 'pr', kind: 'Todo', t: 'Review login PR', meta: 'Client A, done' },
{ id: 'cookies', kind: 'Note', t: 'Session cookies', meta: 'Client A, Oct 2' }
] }
];
var n = 0;
Object.keys(picked).forEach(function (k) { if (picked[k]) n++; });
var groups = data.map((g) => ({
label: g.label,
items: g.items.filter(function (it) { return f === 'all' || (f === 'notes' && it.kind === 'Note') || (f === 'todos' && it.kind === 'Todo'); }).map((it) => {
var on = !!picked[it.id];
return {
t: it.t, meta: it.meta, kind: it.kind, on: on,
kindStyle: 'width: 44px; flex-shrink: 0; height: 22px; border-radius: 8px; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; ' + (it.kind === 'Note' ? 'background: #E3E5EC; color: #3A4152;' : 'background: #F1F2F6; color: #4B5060; box-shadow: inset 0 0 0 1.5px #C3C7D3;'),
checkStyle: 'width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #3A4152;' : 'border: 2px solid #C3C7D3;'),
toggle: () => { var p = Object.assign({}, picked); p[it.id] = !on; this.setState({ picked: p }); }
};
})
}));
var base = 'height: 36px; border: 0; border-radius: 10px; font-size: 13px; font-weight: 700;';
var tabs = [['all', 'All'], ['notes', 'Notes'], ['todos', 'Todos']].map((t) => ({
name: t[1], on: f === t[0],
style: base + (f === t[0] ? ' background: #FFFFFF; color: #15171E; box-shadow: 0 1px 2px rgba(0,0,0,0.08);' : ' background: transparent; color: #4B5060;'),
pick: () => this.setState({ filter: t[0] })
}));
return { groups: groups, tabs: tabs, countText: n + ' linked' };
}
}
</script>
</body>
</html>
