<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agenda, choose month and year</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7080}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F1F2F6; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">
<div style="padding: 52px 20px 0; display: flex; align-items: flex-end; justify-content: space-between;"><div><div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{monthLabel}}</div><h1 style="margin: 6px 0 0; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.035em;">Agenda.</h1></div><sc-if value="{{away}}" hint-placeholder-val="{{false}}"><button onClick="{{goToday}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: #E3E5EC; color: #3A4152; font-size: 13px; font-weight: 700;">Today</button></sc-if></div>
<div style="margin: 16px 16px 0; padding: 6px; border-radius: 18px; background: #FFFFFF; flex-shrink: 0;">
<sc-if value="{{isWeek}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center;">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button onClick="{{d.pick}}" aria-current="{{d.cur}}" style="{{d.style}}">{{d.wd}}<span style="{{d.numStyle}}">{{d.n}}</span><span style="{{d.dot}}"></span></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isMonth}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 6px;">
<button onClick="{{prevMonth}}" aria-label="Previous month" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F1F2F6; font-size: 18px; color: #3A4152;">‹</button>
<button onClick="{{openPicker}}" style="height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: #15171E;">{{viewLabel}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button onClick="{{nextMonth}}" aria-label="Next month" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F1F2F6; font-size: 18px; color: #3A4152;">›</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; gap: 2px;">
<sc-for list="{{heads}}" as="h" hint-placeholder-count="7"><div style="height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4B5060;">{{h}}</div></sc-for>
<sc-for list="{{month}}" as="d" hint-placeholder-count="35">
<button onClick="{{d.pick}}" style="{{d.style}}">{{d.n}}<span style="{{d.dot}}"></span></button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isPicker}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 8px;">
<button onClick="{{prevYear}}" aria-label="Previous year" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F1F2F6; font-size: 18px; color: #3A4152;">‹</button>
<div style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">{{year}}</div>
<button onClick="{{nextYear}}" aria-label="Next year" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F1F2F6; font-size: 18px; color: #3A4152;">›</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding-bottom: 4px;">
<sc-for list="{{months}}" as="m" hint-placeholder-count="12"><button onClick="{{m.pick}}" style="{{m.style}}">{{m.name}}</button></sc-for>
</div>
</sc-if>
<button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 100%; height: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;"><span style="width: 36px; height: 4px; border-radius: 2px; background: #C3C7D3;"></span></button>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 164px; display: flex; flex-direction: column;">
<sc-for list="{{days}}" as="day" hint-placeholder-count="4">
<div style="{{day.headStyle}}"><span>{{day.label}}</span><span style="letter-spacing: 0; text-transform: none; font-weight: 600;">{{day.side}}</span></div>
<sc-if value="{{day.free}}" hint-placeholder-val="{{false}}"><div style="margin-top: 6px; padding: 0 4px; font-size: 14px; color: #4B5060;">Nothing planned</div></sc-if>
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{day.items}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" style="{{it.rowStyle}}"><span style="{{it.timeStyle}}">{{it.time}}<span style="display: block; font-size: 12px; font-weight: 500; color: #4B5060;">{{it.timeEnd}}</span></span><span style="flex: 1; min-width: 0; font-size: 17px; font-weight: 500;">{{it.t}}</span><span style="{{it.pill}}">{{it.l}}</span></a>
</sc-for>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 8px 6px 6px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(21, 23, 30, 0.12);"><a href="Search.dc.html" aria-label="Search" style="grid-column: 1 / -1; margin: 0 0 4px; height: 40px; padding: 0 14px; border-radius: 20px; background: #F1F2F6; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; color: #6B7080;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a><a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>Today</a><a href="Agenda.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #15171E;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Agenda</a><a href="CaptureSheet.dc.html" aria-label="Capture" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #3A4152; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a><a href="Inbox.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><span style="position: relative; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg><span style="position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #3A4152; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">6</span></span>Inbox</a><a href="All.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Lists</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

for (var dd = 1; dd <= dim; dd++) { (function (k, n) {

var mb = 'height: 44px; border: 0; border-radius: 12px; font-size: 14px; font-weight: 600;';
var months = MONTHS.map((m, i) => ({ name: m.slice(0, 3), style: mb + (i === vm ? ' background: #3A4152; color: #FFFFFF;' : ' background: #F1F2F6; color: #15171E;'), pick: () => this.setState({ vm: i, picker: false }) }));

for (var q = 0; q < 8; q++) { (function (d, qi) {
var k = iso(d), its = items[k] || [];
var lab = (k === TODAY ? 'Today, ' : '') + WD[dow(d)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3);
list.push({ label: lab, side: '', free: its.length === 0,

pill: x[2] === 'Recurring' ? 'display: none;' : 'height: 24px; padding: 0 9px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; flex-shrink: 0; background: ' + c[0] + '; color: ' + c[1] + ';' }; }) });
})(add(sd, q), q); }
var folded = [];
list.forEach(function (e, i) {
var prev = folded[folded.length - 1];

});
folded.forEach(function (e) { if (e.free) { e.side = 'Nothing planned'; e.free = false; e.headStyle = e.headStyle.replace('margin-top: 20px', 'margin-top: 16px'); } });

}
}
</script>
