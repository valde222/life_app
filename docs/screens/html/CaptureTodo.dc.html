<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture with details: todo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7080}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2E323D; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">

<div role="dialog" aria-label="New todo" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #F1F2F6; border-radius: 24px 24px 0 0; display: flex; flex-direction: column;">

<div style="padding: 8px 8px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
<a href="CaptureSheet.dc.html" style="justify-self: start; height: 44px; padding: 0 10px; display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;">Cancel</a>
<div style="font-size: 15px; font-weight: 700; color: #15171E;">{{sheetTitle}}</div>
<a href="Main.dc.html" style="justify-self: end; height: 40px; padding: 0 16px; border-radius: 12px; background: #3A4152; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center;">Save</a>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 32px;">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #FFFFFF;">
<sc-if value="{{notEvent}}" hint-placeholder-val="{{true}}"><span style="width: 22px; height: 22px; border-radius: 8px; border: 2px solid #C3C7D3; box-sizing: border-box; flex-shrink: 0;"></span></sc-if><sc-if value="{{isEvent}}" hint-placeholder-val="{{false}}"><span style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3A4152" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span></sc-if>
<input aria-label="Title" value="Set up Client A staging" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 18px; font-weight: 600; color: #15171E; padding: 0;">
</div>

<div style="margin-top: 14px; padding: 0 16px; border-radius: 18px; background: #FFFFFF;">
<a href="MoveTo.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none; box-sizing: border-box;"><span style="color: #4B5060;">List</span><span style="height: 24px; padding: 0 9px; border-radius: 8px; background: #FBE7D7; color: #7A3611; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Client A</span></a>
<a href="DatePicker.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #EEF0F4; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none; box-sizing: border-box;"><span style="color: #4B5060;">Date</span><span style="font-weight: 600;">Fri 23 Oct</span></a>
<a href="TimePicker.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #EEF0F4; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E;"><span style="color: #4B5060;">Time</span><span style="color: #6B7080;">Add time</span></a>
<a href="Recurring.dc.html" style="width: 100%; min-height: 52px; padding: 0; border-top: 1px solid #EEF0F4; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none;"><span style="color: #4B5060;">Repeat</span><span style="color: #6B7080;">Never</span></a>
<div style="min-height: 52px; border-top: 1px solid #EEF0F4; display: flex; align-items: center; justify-content: space-between; font-size: 16px;"><span style="color: #4B5060;">Event</span><button role="switch" aria-label="Event" aria-checked="{{isEvent}}" onClick="{{toggleEvent}}" style="{{evTrack}}"><span style="{{evKnob}}"></span></button></div>
<a href="ReminderPicker.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #EEF0F4; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none;"><span style="color: #4B5060;">Reminder</span><span style="color: #6B7080;">Off</span></a>
</div>

<sc-if value="{{notEvent}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 20px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{stepsLabel}}</div>
<div style="margin-top: 8px; padding: 4px 6px 4px 16px; border-radius: 18px; background: #FFFFFF;">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px;">
<span style="width: 18px; height: 18px; border-radius: 6px; border: 2px solid #C3C7D3; box-sizing: border-box; flex-shrink: 0;"></span>
<div style="flex: 1; min-width: 0; font-size: 16px;">{{st.t}}</div>
<button aria-label="{{st.label}}" onClick="{{st.remove}}" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid #EEF0F4;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<input aria-label="Add a step" placeholder="Add a step" onKeyDown="{{addStep}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: #15171E;">
</div>
</div>

</sc-if>

<div style="margin-top: 20px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">Notes and links</div>
<div style="margin-top: 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;">
<a href="LinkPicker.dc.html" style="height: 48px; border-radius: 16px; border: 1.5px dashed #BCC1CF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;">+ Link…</a>
<a href="CaptureNote.dc.html" style="height: 48px; border-radius: 16px; border: 1.5px dashed #BCC1CF; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;">+ Write a note</a>
</div>



</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var steps = s.steps || ['Create the staging database', 'Set up environment variables', 'Deploy and smoke test'];
var more = !!s.more;
var onToday = !!s.onToday;
var rep = s.rep || 'Never';
var showRepeat = !!s.showRepeat;
var repBase = 'height: 36px; padding: 0 12px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600;';
var repeatVals = {
showRepeat: showRepeat,
toggleRepeat: () => this.setState({ showRepeat: !showRepeat }),
repeatValue: rep === 'Never' ? 'Never' : rep,
repeatValueStyle: rep === 'Never' ? 'color: #6B7080;' : 'font-weight: 600; color: #15171E;',
repeatOpts: ['Never', 'Every few days', 'Weekly', 'Every 2 weeks', 'Monthly'].map((o) => ({ label: o, on: o === rep, style: repBase + (o === rep ? ' background: #3A4152; color: #FFFFFF;' : ' background: #F1F2F6; color: #3A4152;'), pick: () => this.setState({ rep: o }) }))
};

var ev = s.event === undefined ? false : s.event;
var evVals = { sheetTitle: ev ? 'New event' : 'New todo', isEvent: ev, notEvent: !ev, toggleEvent: () => this.setState({ event: !ev }),
evTrack: 'width: 48px; height: 28px; padding: 3px; box-sizing: border-box; border: 0; border-radius: 14px; display: flex; flex-shrink: 0; background: ' + (ev ? '#3A4152' : '#C3C7D3') + '; justify-content: ' + (ev ? 'flex-end' : 'flex-start') + ';',
evKnob: 'width: 22px; height: 22px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);' };
return Object.assign(repeatVals, evVals, {
steps: steps.map((t, i) => ({
t: t,
label: 'Remove step ' + t,
remove: () => { var c = steps.slice(); c.splice(i, 1); this.setState({ steps: c }); }
})),
stepsLabel: 'Steps ' + steps.length,
addStep: (e) => {
if (e.key !== 'Enter') return;
var v = (e.target.value || '').trim();
if (!v) return;
this.setState({ steps: steps.concat([v]) });
e.target.value = '';
},
more: more,
moreChev: 'transition: transform 150ms; transform: rotate(' + (more ? 90 : 0) + 'deg);',
toggleMore: () => this.setState({ more: !more }),
onToday: onToday,
trackStyle: 'width: 48px; height: 28px; padding: 3px; box-sizing: border-box; border: 0; border-radius: 14px; display: flex; background: ' + (onToday ? '#3A4152' : '#C3C7D3') + '; justify-content: ' + (onToday ? 'flex-end' : 'flex-start') + ';',
toggleToday: () => this.setState({ onToday: !onToday })
});
}
}
</script>
</body>
</html>
