<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var made = !!s.made;
var list = s.list || [{ t: 'Add a migration step to the checklist', done: true }, { t: 'Ask Mads about rollback', done: false }];
var sel = s.sel === undefined ? 1 : s.sel;
var F = "font-family: 'Space Grotesk', system-ui, sans-serif;";
return {
items: list.map((x, i) => { var on = i === sel; return { t: x.t, sel: on, checked: x.done ? 'true' : 'false',
row: 'display: flex; align-items: center; gap: 4px; min-height: 40px; margin: 0 -8px; padding: 0 4px 0 8px; border-radius: 10px; background: ' + (on ? '#F1F2F6' : 'transparent') + ';',
box: 'width: 18px; height: 18px; border-radius: 4px; box-sizing: border-box; ' + (x.done ? 'background: #3A4152; border: 2px solid #3A4152;' : 'border: 2px solid #C3C7D3;'),
text: 'flex: 1; min-width: 0; padding: 8px 0; border: 0; background: transparent; text-align: left; font-family: Inter, system-ui, sans-serif; font-size: 16px; color: ' + (x.done ? '#6B7080; text-decoration: line-through;' : '#15171E;'),
tick: () => { var l = list.slice(); l[i] = { t: x.t, done: !x.done }; this.setState({ list: l }); },
select: () => this.setState({ sel: on ? -1 : i }) }; }),
addItem: () => { var l = list.slice(); l.push({ t: 'New item', done: false }); this.setState({ list: l, sel: l.length - 1 }); },
makeTodo: () => this.setState({ made: !made }),
makeTodoLabel: made ? 'Todo in Client A' : 'Make todo',
makeTodoStyle: 'flex-shrink: 0; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; ' + F + ' font-size: 13px; font-weight: 700; ' + (made ? 'background: #DFF1E2; color: #22542B;' : 'background: #3A4152; color: #FFFFFF;')
};
}
}
</script>
