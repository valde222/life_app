<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F1F2F6; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">

<div style="padding: 52px 20px 0; display: flex; align-items: flex-end; justify-content: space-between;">
<div>
<h1 style="margin: 0 0 0; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.035em;">Inbox.</h1>
</div>

</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 120px; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<div style="margin-top: 14px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{sec.label}}</div>
<sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">

<sc-if value="{{it.collapsed}}" hint-placeholder-val="{{true}}">
<button onClick="{{it.open}}" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px 8px 14px; box-sizing: border-box; border-radius: 16px; border: 0; background: #FFFFFF; text-align: left; color: #15171E; flex-shrink: 0;">
<sc-if value="{{it.isTodo}}" hint-placeholder-val="{{true}}"><span aria-label="Todo" style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid #C3C7D3; box-sizing: border-box; flex-shrink: 0;"></span></sc-if>
<sc-if value="{{it.isNote}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Quick note" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M9 8h6M9 12h6"></path></svg></sc-if>
<span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 17px; font-weight: 500;">{{it.t}}</span></span>
</button>
</sc-if>

<sc-if value="{{it.expanded}}" hint-placeholder-val="{{false}}">
<div style="padding: 16px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 2px #3A4152; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0;">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
<div><a href="{{it.href}}" style="display: block; font-size: 17px; font-weight: 600; color: #15171E; text-decoration: none;">{{it.t}}</a></div>
</div>

<sc-if value="{{it.isTodo}}" hint-placeholder-val="{{true}}">
<div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">Move to</div>
<div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px;">
<button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #DCF1EE; color: #14524A; font-size: 14px; font-weight: 600;">Shopping</button>
<button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #E3ECF8; color: #23446C; font-size: 14px; font-weight: 600;">Life</button>
<button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #ECE4F8; color: #4B2E7A; font-size: 14px; font-weight: 600;">Apartment</button>
<button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #FBE7D7; color: #7A3611; font-size: 14px; font-weight: 600;">Client A</button>
<a href="MoveTo.dc.html" style="height: 34px; padding: 0 12px; border-radius: 10px; background: #ECEDF1; color: #4B5060; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center;">More…</a>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
<button style="height: 44px; border-radius: 12px; border: 0; background: #3A4152; color: #FFFFFF; font-size: 14px; font-weight: 700;">Today</button>
<a href="DatePicker.dc.html" style="height: 44px; border-radius: 12px; background: #F1F2F6; color: #15171E; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Date</a>
<a href="InboxTodo.dc.html" style="height: 44px; border-radius: 12px; background: #F1F2F6; color: #15171E; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Repeat…</a>
<button style="height: 44px; border-radius: 12px; border: 0; background: #F1F2F6; color: #B4321F; font-size: 14px; font-weight: 600;">Delete</button>
</div>
</sc-if>

<sc-if value="{{it.isNote}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<a href="KeepNoteDetail.dc.html" style="height: 48px; border-radius: 12px; background: #3A4152; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center;">Keep</a>
<button onClick="{{it.makeTodo}}" style="height: 48px; border-radius: 12px; border: 0; background: #F1F2F6; color: #15171E; font-size: 15px; font-weight: 600;">Make todo</button>
<button onClick="{{it.letGo}}" style="height: 48px; border-radius: 12px; border: 0; background: #F1F2F6; color: #4B5060; font-size: 15px; font-weight: 600;">Archive</button>
</div></sc-if>
</div>
</sc-if>

</sc-for>
</sc-for>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<a href="InboxZero.dc.html" style="margin-top: 24px; padding: 16px; border-radius: 16px; background: #FFFFFF; text-align: center; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;">All sorted. See Inbox zero</a>
</sc-if>
</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 164px; min-height: 56px; padding: 6px 6px 6px 18px; box-sizing: border-box; border-radius: 18px; background: #3A4152; display: flex; align-items: center; gap: 12px;">
<div style="flex: 1; min-width: 0;"><div style="font-size: 15px; font-weight: 600; color: #FFFFFF;">{{toastTitle}}</div></div>
<button onClick="{{undo}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #3A4152; font-size: 14px; font-weight: 700;">Undo</button>
</div>
</sc-if>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 8px 6px 6px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(21, 23, 30, 0.12);"><a href="Search.dc.html" aria-label="Search" style="grid-column: 1 / -1; margin: 0 0 4px; height: 40px; padding: 0 14px; border-radius: 20px; background: #F1F2F6; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 15px; color: #6B7080;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a><a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>Today</a><a href="Agenda.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Agenda</a><a href="CaptureSheet.dc.html" aria-label="Capture" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #3A4152; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a><a href="Inbox.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 700; color: #15171E;"><span style="position: relative; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg><span style="position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #3A4152; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">6</span></span>Inbox</a><a href="All.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Lists</a></nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var openId = s.open !== undefined ? s.open : (this.props.open || 'wall');
var gone = s.gone || {};
var data = [
{ id: 'wall', kind: 'note', t: 'Wall is 312 cm', meta: 'Quick note, 09:12', today: true },
{ id: 'idea', kind: 'note', t: 'Idea: a tray app for the PC hotkey', meta: 'Quick note, 13:02', today: true },
{ id: 'butter', kind: 'todo', t: 'buy butter', meta: 'Todo, 14:32', today: true },
{ id: 'pg', kind: 'todo', t: 'read up on postgres indexes', meta: 'Todo, Tue', today: false },
{ id: 'bath', kind: 'todo', t: 'fix the bike light', meta: 'Todo, Mon', today: false },
{ id: 'lock', kind: 'note', t: 'Bike lock code 4471', meta: 'Quick note, Oct 16', today: false }
];
var act = (d, kind) => {
var g = Object.assign({}, gone); g[d.id] = kind;
var titles = { keep: 'Kept as a note', todo: 'Made into a todo', letgo: 'Moved to the archive' };
var subs = { keep: 'In Notes. Add it to a list any time.', todo: 'Waiting here as a todo until you sort it.', letgo: 'Still findable by search and by day.' };
this.setState({ gone: g, open: null, toast: { id: d.id, title: titles[kind], sub: subs[kind] } });
};
var left = data.filter(function (d) { return !gone[d.id] || gone[d.id] === 'todo'; });
var mk = (d) => {
var isTodo = d.kind === 'todo' || gone[d.id] === 'todo';
var exp = openId === d.id;
return {
t: d.t, meta: isTodo && d.kind === 'note' ? 'Todo, from a quick note' : d.meta,
isTodo: isTodo, isNote: !isTodo, expanded: exp, collapsed: !exp, href: isTodo ? 'InboxTodo.dc.html' : 'KeepNoteDetail.dc.html',
open: () => this.setState({ open: d.id }),
keep: () => act(d, 'keep'),
makeTodo: () => act(d, 'todo'),
letGo: () => act(d, 'letgo')
};
};
var sections = [];
var todayItems = left.filter(function (d) { return d.today; }).map(mk);
var earlier = left.filter(function (d) { return !d.today; }).map(mk);
if (todayItems.length) sections.push({ label: 'Today', items: todayItems });
if (earlier.length) sections.push({ label: 'Earlier', items: earlier });
var t = s.toast;
return {
sections: sections,
isEmpty: left.length === 0,
countText: (function () { var nt = left.filter(function (d) { return d.kind === 'todo' || gone[d.id] === 'todo'; }).length; return nt + ' todos, ' + (left.length - nt) + ' notes'; })(),
hasToast: !!t,
toastTitle: t ? t.title : '',
toastSub: t ? t.sub : '',
undo: () => { if (!t) return; var g = Object.assign({}, gone); delete g[t.id]; this.setState({ gone: g, toast: null, open: t.id }); }
};
}
}
</script>
</body>
</html>
