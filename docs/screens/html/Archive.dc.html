<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archive</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
input::placeholder{color:#6B7080}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F1F2F6; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">

<div style="padding: 44px 8px 0 4px;">
<a href="Search.dc.html" style="height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 2px; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Search</a>
</div>
<div style="padding: 0 20px;">
<h1 style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.035em;">Archive.</h1>
</div>

<div role="tablist" aria-label="Show" style="margin: 16px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; background: #E3E5EC; border-radius: 14px;">
<button role="tab" aria-selected="{{isArchive}}" onClick="{{showArchive}}" style="{{archiveStyle}}">Archive</button>
<button role="tab" aria-selected="{{isDone}}" onClick="{{showDone}}" style="{{doneStyle}}">Done</button>
</div>
<label style="margin: 8px 16px 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #FFFFFF; border-radius: 14px; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input aria-label="Search the archive" placeholder="Search the archive" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #15171E;"></label>



<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 164px;">

<sc-if value="{{isArchive}}" hint-placeholder-val="{{true}}">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="margin-top: 16px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{g.label}}</div>
<div style="margin-top: 8px; padding: 4px 8px 4px 16px; border-radius: 16px; background: #FFFFFF;">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="{{it.rowStyle}}"><span style="flex: 1; min-width: 0;"><span style="display: block; font-size: 15px;">{{it.t}}</span><sc-if value="{{it.hasSub}}" hint-placeholder-val="{{false}}"><span style="display: block; font-size: 12px; color: #4B5060;">{{it.sub}}</span></sc-if></span><button onClick="{{it.restore}}" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: #F1F2F6; font-size: 13px; font-weight: 600; color: #3A4152;">{{it.restoreLabel}}</button><button aria-label="{{it.deleteLabel}}" onClick="{{it.del}}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4321F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button></div>
</sc-for>
</div>
</sc-for>
<sc-if value="{{archiveEmpty}}" hint-placeholder-val="{{false}}"><div style="padding: 40px 0; text-align: center; font-size: 15px; color: #4B5060;">Nothing archived.</div></sc-if>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
<sc-for list="{{days}}" as="day" hint-placeholder-count="2">
<div style="margin-top: 16px; padding: 0 4px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;"><span>{{day.label}}</span><span style="letter-spacing: 0;">{{day.count}}</span></div>
<div style="margin-top: 8px; padding: 4px 16px; border-radius: 16px; background: #FFFFFF;">
<sc-for list="{{day.items}}" as="d" hint-placeholder-count="2">
<div style="{{d.rowStyle}}"><span style="width: 18px; height: 18px; border-radius: 4px; background: #3A4152; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span><span style="flex: 1; font-size: 15px;">{{d.t}}</span><span style="{{d.labelStyle}}">{{d.list}}</span><button style="height: 32px; margin-left: 6px; padding: 0 10px; border: 0; border-radius: 10px; background: #F1F2F6; font-size: 12px; font-weight: 600; color: #3A4152;">Not done</button></div>
</sc-for>
</div>
</sc-for>
</sc-if>
<a href="Deleted.dc.html" style="margin-top: 20px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; color: #15171E;"><span style="flex: 1; font-size: 16px; font-weight: 500;">Recently deleted</span><span style="font-size: 14px; color: #6B7080;">3</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7080" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>

</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 164px; height: 56px; padding: 0 6px 0 18px; box-sizing: border-box; border-radius: 18px; background: #3A4152; display: flex; align-items: center; gap: 12px;">
<div style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #FFFFFF;">{{toast}}</div>
<button onClick="{{undo}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FFFFFF; color: #3A4152; font-size: 14px; font-weight: 700;">Undo</button>
</div>
</sc-if>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(21, 23, 30, 0.12);"><a href="Main.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"></path></svg>Today</a><a href="Agenda.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Agenda</a><a href="CaptureSheet.dc.html" aria-label="Capture" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: #3A4152; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a><a href="Inbox.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><span style="position: relative; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M4 13h5l1 2h4l1-2h5"></path></svg><span style="position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #3A4152; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;">6</span></span>Inbox</a><a href="All.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 500; color: #4B5060;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r="1"></circle><circle cx="4.5" cy="12" r="1"></circle><circle cx="4.5" cy="18" r="1"></circle></svg>Lists</a></nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var done = s.tab === 'done';
var segBase = 'height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700;';
var on = segBase + ' background: #FFFFFF; color: #15171E; box-shadow: 0 1px 2px rgba(0,0,0,0.08);';
var off = segBase + ' background: transparent; color: #4B5060;';
var raw = [
{ label: 'Wed 21 Oct', items: [['Review login PR','Client A','#7A3611'],['Coffee beans','Shopping','#14524A']] },
{ label: 'Tue 20 Oct', items: [['Set up the desk','Apartment','#4B2E7A'],['Write deploy checklist','Client B','#7A1F48'],['Call mum','Life','#23446C']] },
{ label: 'Mon 19 Oct', items: [['Fix token refresh','Client A','#7A3611']] }
];
var gone = s.gone || {};
var arch = [
{ label: 'Wed 21 Oct', items: [{ id: 'park', t: 'Parking: level 3, spot 41', kind: 'note' }] },
{ label: 'Tue 20 Oct', items: [{ id: 'pizza', t: 'Pizza place: Mamma\u2019s on Jagtvej', kind: 'note' }, { id: 'router', t: 'Router password idea', kind: 'note' }] },
{ label: 'Closed lists', items: [{ id: 'clientC', t: 'Client C', sub: 'Closed Sep 30, 14 notes', kind: 'list' }] }
];
var act = (it, text) => { var g = Object.assign({}, gone); g[it.id] = true; this.setState({ gone: g, toast: { id: it.id, text: text } }); };
var groups = arch.map((g) => {
var left = g.items.filter(function (it) { return !gone[it.id]; });
return { label: g.label, items: left.map((it, i) => ({
t: it.t, sub: it.sub || '', hasSub: !!it.sub,
restoreLabel: it.kind === 'list' ? 'Restore' : 'Restore',
deleteLabel: 'Delete ' + it.t,
rowStyle: 'min-height: 52px; display: flex; align-items: center; gap: 6px;' + (i ? ' border-top: 1px solid #EEF0F4;' : ''),
restore: () => act(it, it.kind === 'list' ? 'List restored' : 'Kept as a note'),
del: () => act(it, 'Deleted')
})) };
}).filter(function (g) { return g.items.length > 0; });
var t = s.toast;
var days = raw.map(function (d) { return { label: d.label, count: d.items.length + ' done', items: d.items.map(function (x, i) { return { t: x[0], list: x[1], labelStyle: 'height: 24px; padding: 0 9px; border-radius: 8px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; color: ' + x[2] + '; background: ' + ({'#7A3611':'#FBE7D7','#14524A':'#DCF1EE','#4B2E7A':'#ECE4F8','#7A1F48':'#FBE0EC','#23446C':'#E3ECF8'})[x[2]] + ';', rowStyle: 'min-height: 48px; display: flex; align-items: center; gap: 12px;' + (i ? ' border-top: 1px solid #EEF0F4;' : '') }; }) }; });
return {
isArchive: !done, isDone: done,
archiveStyle: done ? off : on, doneStyle: done ? on : off,
showArchive: () => this.setState({ tab: 'archive' }),
showDone: () => this.setState({ tab: 'done' }),
searchText: done ? 'Search done' : 'Search the archive',
days: days,
groups: groups,
archiveEmpty: groups.length === 0,
hasToast: !!t,
toast: t ? t.text : '',
undo: () => { if (!t) return; var g = Object.assign({}, gone); delete g[t.id]; this.setState({ gone: g, toast: null }); }
};
}
}
</script>
</body>
</html>
