<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A4152;text-decoration:none}a:hover{color:#15171E}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F1F2F6; color: #15171E; font-family: 'Space Grotesk', system-ui, sans-serif;">

<div style="padding: 44px 8px 0 4px; display: flex; align-items: center; justify-content: space-between;">
<a href="Main.dc.html" style="height: 44px; padding: 0 8px; display: inline-flex; align-items: center; gap: 2px; text-decoration: none; font-size: 15px; font-weight: 600; color: #3A4152;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Today</a>

</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 32px;">

<div style="display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 4px; border-radius: 14px; background: #FFFFFF;">
<sc-if value="{{notEvent}}" hint-placeholder-val="{{true}}"><button aria-label="Mark Set up the living room done" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><span style="width: 26px; height: 26px; border-radius: 8px; border: 2px solid #C3C7D3; box-sizing: border-box;"></span></button></sc-if><sc-if value="{{isEvent}}" hint-placeholder-val="{{false}}"><span aria-label="Event" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A4152" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span></sc-if>
<input aria-label="Title" value="Set up the living room" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 18px; font-weight: 600; color: #15171E; padding: 0;">
</div>

<div style="margin-top: 16px; padding: 0 16px; border-radius: 18px; background: #FFFFFF;">
<a href="MoveTo.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none;"><span style="color: #4B5060;">List</span><span style="height: 24px; padding: 0 9px; border-radius: 8px; background: #ECE4F8; color: #4B2E7A; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center;">Apartment</span></a>
<a href="DatePicker.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #EEF0F4; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none;"><span style="color: #4B5060;">Date</span><span style="font-weight: 600;">Today</span></a>
<a href="TimePicker.dc.html" style="width: 100%; min-height: 52px; padding: 0; border: 0; border-top: 1px solid #EEF0F4; background: transparent; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E;"><span style="color: #4B5060;">Time</span><span style="color: #4B5060;">Add time</span></a>
<a href="Recurring.dc.html" style="width: 100%; min-height: 52px; padding: 0; border-top: 1px solid #EEF0F4; display: flex; align-items: center; justify-content: space-between; font-size: 16px; color: #15171E; text-decoration: none;"><span style="color: #4B5060;">Repeat</span><span style="color: #6B7080;">Never</span></a>
<div style="min-height: 52px; border-top: 1px solid #EEF0F4; display: flex; align-items: center; justify-content: space-between; font-size: 16px;"><span style="color: #4B5060;">Event</span><button role="switch" aria-label="Event" aria-checked="{{isEvent}}" onClick="{{toggleEvent}}" style="{{evTrack}}"><span style="{{evKnob}}"></span></button></div>
</div>

<sc-if value="{{notEvent}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 20px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">{{stepsLabel}}</div>
<div style="margin-top: 8px; padding: 4px 16px 4px 6px; border-radius: 18px; background: #FFFFFF;">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 4px; min-height: 48px;">
<button aria-label="{{st.label}}" aria-pressed="{{st.on}}" onClick="{{st.toggle}}" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center;">
<sc-if value="{{st.on}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; border-radius: 6px; background: #3A4152; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span></sc-if>
<sc-if value="{{st.off}}" hint-placeholder-val="{{true}}"><span style="width: 20px; height: 20px; border-radius: 6px; border: 2px solid #C3C7D3; box-sizing: border-box;"></span></sc-if>
</button>
<div style="{{st.textStyle}}">{{st.t}}</div>
</div>
</sc-for>
<button style="height: 44px; margin-left: 10px; padding: 0; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: #3A4152;">+ Add step</button>
</div>

</sc-if>

<div style="margin-top: 20px; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4B5060;">Notes</div>
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px;">
<div style="padding: 14px 16px; border-radius: 16px; background: #FFFFFF;"><div style="font-size: 16px; font-weight: 600;">Living room plan</div><div style="margin-top: 2px; font-size: 14px; line-height: 1.4; color: #4B5060;">Shelf on the long wall, TV opposite the window.</div></div>
<a href="CaptureNote.dc.html" style="height: 48px; border-radius: 16px; border: 1.5px dashed #BCC1CF; background: transparent; font-size: 15px; font-weight: 600; color: #3A4152; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;">+ Write a note</a>
</div>

<div style="margin-top: 20px; display: flex; justify-content: space-between;">
<span></span>
<a href="Main.dc.html" style="height: 44px; padding: 0 4px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: #B4321F; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;">Delete</a>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {};
var done = s.done || { wall: true };
var onToday = s.onToday === undefined ? true : s.onToday;
var rep = s.rep || 'Never';
var showRepeat = !!s.showRepeat;
var repBase = 'height: 36px; padding: 0 12px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600;';
var repeatVals = {
showRepeat: showRepeat,
toggleRepeat: () => this.setState({ showRepeat: !showRepeat }),
repeatValue: rep === 'Never' ? 'Never' : rep,
repeatValueStyle: rep === 'Never' ? 'color: #6B7080;' : 'font-weight: 600; color: #15171E;',
repeatOpts: ['Never', 'Every few days', 'Weekly', 'Every 2 weeks', 'Monthly'].map((o) => ({ label: o, on: o === rep, style: repBase + (o === rep ? ' background: #3A4152; color: #FFFFFF;' : ' background: #F1F2F6; color: #3A4152;'), pick: () => this.setState({ rep: o }) }))
};

var list = [{ id: 'wall', t: 'Measure the wall' }, { id: 'shelf', t: 'Buy a shelf' }, { id: 'tv', t: 'Mount the TV' }];
var n = 0;
var steps = list.map((st) => {
var on = !!done[st.id];
if (on) n++;
return {
t: st.t, on: on, off: !on,
label: (on ? 'Mark ' + st.t + ' not done' : 'Mark ' + st.t + ' done'),
textStyle: on ? 'flex: 1; font-size: 16px; color: #6B7080; text-decoration: line-through;' : 'flex: 1; font-size: 16px; color: #15171E;',
toggle: () => { var d = Object.assign({}, done); d[st.id] = !on; this.setState({ done: d }); }
};
});
var ev = s.event === undefined ? false : s.event;
var evVals = { isEvent: ev, notEvent: !ev, toggleEvent: () => this.setState({ event: !ev }),
evTrack: 'width: 48px; height: 28px; padding: 3px; box-sizing: border-box; border: 0; border-radius: 14px; display: flex; flex-shrink: 0; background: ' + (ev ? '#3A4152' : '#C3C7D3') + '; justify-content: ' + (ev ? 'flex-end' : 'flex-start') + ';',
evKnob: 'width: 22px; height: 22px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);' };
return Object.assign(repeatVals, evVals, {
steps: steps,
stepsLabel: 'Steps ' + n + ' of ' + list.length,
onToday: onToday,
trackStyle: 'width: 48px; height: 28px; padding: 3px; box-sizing: border-box; border: 0; border-radius: 14px; display: flex; background: ' + (onToday ? '#3A4152' : '#C3C7D3') + '; justify-content: ' + (onToday ? 'flex-end' : 'flex-start') + ';',
knobStyle: 'width: 22px; height: 22px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);',
toggleToday: () => this.setState({ onToday: !onToday })
});
}
}
</script>
</body>
</html>
