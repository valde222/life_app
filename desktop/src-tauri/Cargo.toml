[package]
name = "life"
version = "0.1.0"
description = "Life desktop app"
authors = ["Valdemar"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
