name: Set up the app
description: Node 22 with the npm cache, and the app's dependencies installed with npm ci.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: app/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: app
