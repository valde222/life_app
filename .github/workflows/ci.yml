name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: npm test
      - run: npm run build
      - name: PocketBase API and attack tests
        working-directory: pocketbase
        env:
          PB_URL: http://localhost:8090
          PB_USER_EMAIL: ci@example.com
          PB_USER_PASSWORD: ci-password-for-tests
          PB_ADMIN_EMAIL: admin@example.com
          PB_ADMIN_PASSWORD: ci-admin-password-for-tests
        run: |
          tests/start-server.sh life-ci-pocketbase 8090
          node --test --test-concurrency=1 tests/*.test.mjs
          docker stop life-ci-pocketbase
      - name: Encrypted backup and restore
        working-directory: .
        run: ./deploy/backup/test.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - name: ESLint, layer boundaries, design tokens and Prettier
        run: npm run lint
        working-directory: app

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: npm run build
        working-directory: app
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: rustfmt, clippy (warnings are errors) and unit tests
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm run build && npx cap sync android
        working-directory: app
      - name: Share target and manifest security tests
        run: ./gradlew app:testDebugUnitTest
        working-directory: app/android

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every diagram renders
        run: ./scripts/check-diagrams.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the whole history (gitleaks)
        run: >
          docker run --rm -v "$PWD":/repo -w /repo
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git --redact --exit-code 1 .
      - name: Known vulnerabilities in npm and Cargo dependencies (OSV)
        run: >
          docker run --rm -v "$PWD":/src:ro
          ghcr.io/google/osv-scanner:v2.2.2@sha256:fd62daecbaaed24442031574540e8af6dbaf0ab0a3e28c626bec0dd235a28346
          scan source --lockfile /src/app/package-lock.json --lockfile /src/desktop/src-tauri/Cargo.lock
          --config /src/desktop/src-tauri/osv-scanner.toml
      - name: npm audit
        working-directory: app
        run: npm audit --audit-level=moderate
