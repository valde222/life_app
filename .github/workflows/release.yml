name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Version from the tag
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Release tags are vMAJOR.MINOR.PATCH with MINOR and PATCH under 100 (Android's versionCode), not $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - run: npm run build -- --define "LIFE_VERSION='$LIFE_VERSION'"
        working-directory: app
        env:
          LIFE_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: app/dist/app/browser

  windows:
    needs: web
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: app/dist/app/browser
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Signed installer
        shell: bash
        working-directory: desktop
        env:
          LIFE_VERSION: ${{ needs.web.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secrets (see desktop/README.md); installed apps only take signed updates"
            exit 1
          fi
          config=$(jq -nc --arg version "$LIFE_VERSION" \
            --arg manifest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            '{version: $version, bundle: {createUpdaterArtifacts: true}, plugins: {updater: {endpoints: [$manifest]}}}')
          cargo tauri build --config "$config"
      - name: Update manifest
        shell: bash
        working-directory: desktop/src-tauri/target/release/bundle/nsis
        env:
          LIFE_VERSION: ${{ needs.web.outputs.version }}
        run: |
          installer=$(ls *-setup.exe)
          jq -n --arg version "$LIFE_VERSION" --arg signature "$(cat "$installer.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$installer" \
            '{version: $version, pub_date: (now | todate), platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/latest.json

  android:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-app
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: app/dist/app/browser
      - run: npx cap sync android
        working-directory: app
      - name: Signed release APK
        working-directory: app/android
        env:
          LIFE_VERSION: ${{ needs.web.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LIFE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LIFE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIFE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_* secrets (see app/android/README.md); releases are never debug builds"
            exit 1
          fi
          export LIFE_KEYSTORE_FILE="$RUNNER_TEMP/life.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$LIFE_KEYSTORE_FILE"
          ./gradlew assembleRelease
          rm "$LIFE_KEYSTORE_FILE"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/life-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: life-*.apk
