name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/dist/app/browser

  windows:
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: app/dist/app/browser
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo tauri build
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: app/dist/app/browser
      - run: npm ci && npx cap sync android
        working-directory: app
      - run: ./gradlew assembleDebug
        working-directory: app/android
      - run: mv app/android/app/build/outputs/apk/debug/app-debug.apk "life-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: life-*.apk
